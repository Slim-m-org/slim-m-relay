# SPDX-License-Identifier: Apache-2.0
#
# Publishes the relay image to GHCR on a version tag.
#
# The relay has no release-please setup, so a tag is the release trigger: push
# v0.1.0 and this builds, publishes, and signs. Images are built natively per
# architecture rather than under QEMU, matching the core repo, because the
# emulated arm64 build is slow and has burned us before with a silently
# host-arch binary.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag on a red commit must not publish and sign an image, so the same checks ci runs
  # gate the build. Manual dispatch is limited to main for the same reason.
  ci:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  image:
    needs: [ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: name the image after this repo's owner, lowercased for GHCR
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/slim-m-relay" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max

      - name: export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: relay-image-digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          if-no-files-found: error

  merge:
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: name the image after this repo's owner, lowercased for GHCR
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/slim-m-relay" >> "$GITHUB_ENV"
      - name: resolve version
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            version="0.0.0-dev"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: relay-image-digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create and inspect manifest
        id: manifest
        run: |
          version="${{ steps.ver.outputs.version }}"
          refs=()
          for f in /tmp/digests/*; do
            refs+=("${IMAGE}@$(cat "$f")")
          done
          tags=(-t "${IMAGE}:${version}" -t "${IMAGE}:sha-${GITHUB_SHA}")
          # `latest` is the rolling tag the deployment tracks for auto-updates, so only a
          # stable tag moves it: a prerelease tag (v0.2.0-rc1) or a manual dispatch gets the
          # version and sha tags alone, which still lets an image be pinned and traced.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [[ "${version}" != *-* ]]; then
            tags+=(-t "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: cosign sign (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.manifest.outputs.digest }}"
