# SPDX-License-Identifier: Apache-2.0
name: push-relay-contract

# Mirrors slim-m's workflow of the same name, so a relay-side change to the
# push contract (send.go's field names, its platform/kind vocabulary, or
# maxPayloadBytes) is checked against the server's real, freshly generated
# request too, not just against whatever fixture last happened to be
# committed. See internal/api/push_relay_contract_test.go and slim-m's
# crates/slimm-server/tests/push_relay_contract_fixture.rs.
on:
  push:
    branches: [main]
    paths:
      - "internal/api/send.go"
      - "internal/api/push_relay_contract_test.go"
      - "internal/push/**"
      - ".github/workflows/push-relay-contract.yml"
  pull_request:
    paths:
      - "internal/api/send.go"
      - "internal/api/push_relay_contract_test.go"
      - "internal/push/**"
      - ".github/workflows/push-relay-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-relay-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: checkout slim-m-relay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: checkout slim-m
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/slim-m
          path: slim-m
          # No explicit token: input. An empty string is a provided value, not
          # "unset", so it overrides checkout's own `default: ${{ github.token }}`
          # and the step authenticates with a blank bearer instead of falling
          # back to it - GitHub responds 401 rather than serving the clone
          # anonymously. Leaving this unset lets the default apply, which is
          # already sufficient to read a public repo.

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: generate the fixture from real slimm-server code
        working-directory: slim-m
        run: cargo test -p slimm-server --test push_relay_contract_fixture
        env:
          SQLX_OFFLINE: "true"
          SLIMM_PUSH_CONTRACT_FIXTURE_OUT: ${{ github.workspace }}/internal/api/testdata/push_relay_contract.generated.json

      # A silently broken generation step (wrong env var name, wrong path, a
      # future refactor of the fixture test that stops writing the file)
      # must not be allowed to fall through into "drive it through the real
      # relay handler" quietly skipping and the job still going green.
      - name: assert the fixture landed
        run: |
          fixture="internal/api/testdata/push_relay_contract.generated.json"
          if [ ! -s "$fixture" ]; then
            echo "::error::$fixture is missing or empty; the fixture generation step above did not produce it"
            exit 1
          fi

      - name: drive it through the real relay handler
        env:
          # A missing fixture at this point is a bug in this workflow (see
          # the assertion step above), not a normal local-dev situation, so
          # the test must fail loudly rather than the t.Skipf it uses for an
          # ordinary `go test ./...` run without a sibling slim-m checkout.
          SLIMM_PUSH_CONTRACT_FIXTURE_REQUIRED: "1"
        run: |
          set -euo pipefail
          # `-run` silently matching zero tests exits 0 with nothing asserted,
          # same failure shape as the skip this guards against; requiring the
          # test's own PASS line means a typo'd pattern or a skip both fail
          # this step instead of the job going green having asserted nothing.
          go test ./internal/api/... -run '^TestPushRelayContract$' -v | tee /tmp/push-relay-contract.log
          # go test -v prints the duration after the name ("--- PASS: X (0.00s)"),
          # so anchoring on the name alone would never match and this gate
          # would fail every run regardless of the result.
          grep -qE '^--- PASS: TestPushRelayContract \('  /tmp/push-relay-contract.log
