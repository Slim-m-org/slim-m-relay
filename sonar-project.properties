# SonarQube Cloud analysis scope, read by .github/workflows/sonar.yml.
sonar.projectKey=Slim-m-org_slim-m-relay
sonar.organization=slim-m-org
sonar.projectName=slim-m-relay
sonar.sourceEncoding=UTF-8

# Tests are scanned under test rules rather than counted as relay code.
sonar.sources=.
sonar.exclusions=**/*_test.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out
